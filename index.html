<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Society Manager</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 14px;
      min-height: 100vh;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    h1 { font-size: 1.35rem; font-weight: 700; }
    h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 10px; }
    p.subtitle { font-size: 0.86rem; color: var(--muted); margin-top: 4px; margin-bottom: 16px; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 5px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
    }
    input:focus, select:focus { border-color: var(--primary); }

    button.btn {
      width: 100%;
      padding: 11px;
      background-color: var(--primary);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button.btn:disabled { opacity: 0.6; cursor: not-allowed; }

    button.btn-outline {
      background: transparent;
      color: var(--danger);
      border: 1px solid #fecaca;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px 4px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Active Turn Banner */
    .turn-banner {
      padding: 14px;
      border-radius: 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      margin-bottom: 14px;
    }

    .turn-banner.my-turn {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .turn-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      margin-bottom: 6px;
    }

    .my-turn .turn-badge { background: var(--success); }

    /* Filters Bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      max-height: 420px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th, td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      font-weight: 600;
      color: var(--muted);
      background: #f8fafc;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr.active-row td {
      background-color: #f0fdf4;
      font-weight: 600;
      color: #15803d;
    }

    /* Badges */
    .badge-paid {
      background: #dcfce7;
      color: #15803d;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.75rem;
      display: inline-block;
    }

    .badge-unpaid {
      background: #fee2e2;
      color: #b91c1c;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.75rem;
      display: inline-block;
    }

    .action-btn {
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    .action-btn.pay { background: var(--success); color: #fff; }
    .action-btn.unpay { background: #94a3b8; color: #fff; }

    /* Summary Bar */
    .summary-card {
      display: flex;
      justify-content: space-between;
      background: #f1f5f9;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }

    .summary-card b { color: var(--text); }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: var(--danger);
      margin-top: 8px;
    }

    .fcm-status {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      margin-top: 10px;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      padding: 18px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">

    <!-- ================= LOGIN VIEW ================= -->
    <div id="loginView" class="card">
      <h1>🏢 Society Manager</h1>
      <p class="subtitle">Login to check gate turn, maintenance & ledger</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password" />
        </div>

        <button type="submit" id="loginBtn" class="btn">Login</button>
        <div id="loginError" class="status-msg"></div>
      </form>
    </div>

    <!-- ================= DASHBOARD VIEW ================= -->
    <div id="dashboardView" class="hidden">
      <div class="top-bar">
        <div>
          <h1 id="welcomeText">Namaste!</h1>
          <div id="userSubText" style="font-size: 0.82rem; color: var(--muted);"></div>
        </div>
        <button id="logoutBtn" class="btn-outline">Logout</button>
      </div>

      <!-- Gate Turn Alert Banner -->
      <div id="currentTurnBox" class="turn-banner">
        <span id="turnBadge" class="turn-badge">Current Gate Turn</span>
        <h2 id="activeFamilyTitle" style="margin-bottom: 2px;">Checking...</h2>
        <div id="activeDateRange" style="font-size: 0.82rem; color: var(--muted);">Loading dates...</div>
      </div>

      <!-- Navigation Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('gateTab', this)">🚪 Gate Turn</button>
        <button class="tab-btn" onclick="switchTab('maintTab', this)">💳 Maintenance</button>
        <button class="tab-btn" onclick="switchTab('ledgerTab', this)">📊 Ledger</button>
      </div>

      <!-- TAB 1: Gate Turn Schedule -->
      <div id="gateTab" class="card">
        <h2>🗓️ Gate Locking Schedule</h2>
        <div class="table-wrap">
          <table id="gateTable"></table>
        </div>
      </div>

      <!-- TAB 2: Maintenance Records -->
      <div id="maintTab" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h2>💳 Maintenance Records</h2>
        </div>

        <!-- Filter Dropdown -->
        <div class="filter-bar">
          <select id="maintMonthFilter" onchange="filterMaintenance()">
            <option value="ALL">All Months</option>
          </select>
          <select id="maintStatusFilter" onchange="filterMaintenance()">
            <option value="ALL">All Status</option>
            <option value="Paid">Paid</option>
            <option value="Unpaid">Unpaid / Pending</option>
          </select>
        </div>

        <div class="table-wrap">
          <table id="maintTable"></table>
        </div>
      </div>

      <!-- TAB 3: Society Ledger -->
      <div id="ledgerTab" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h2>📊 Society Ledger</h2>
          <button id="addEntryBtn" class="action-btn pay hidden" onclick="openLedgerModal()">+ Add Entry</button>
        </div>

        <!-- Ledger Balance Summary -->
        <div class="summary-card">
          <div>Total Funds: <b id="sumCredit" style="color: var(--success);">₹0</b></div>
          <div>Expenses: <b id="sumDebit" style="color: var(--danger);">₹0</b></div>
          <div>Balance: <b id="sumBalance">₹0</b></div>
        </div>

        <!-- Filter Dropdown -->
        <div class="filter-bar">
          <select id="ledgerTypeFilter" onchange="filterLedger()">
            <option value="ALL">All Transactions</option>
            <option value="Fund">Funds / Credit Only</option>
            <option value="Expense">Expenses / Debit Only</option>
          </select>
        </div>

        <div class="table-wrap">
          <table id="ledgerTable"></table>
        </div>
      </div>

      <div id="fcmStatusText" class="fcm-status"></div>
    </div>

    <!-- ================= ADD LEDGER ENTRY MODAL ================= -->
    <div id="ledgerModal" class="modal hidden">
      <div class="modal-content">
        <h2>Add Ledger Transaction</h2>
        <form id="ledgerForm">
          <div class="form-group">
            <label>Type</label>
            <select id="entryType" required>
              <option value="Fund">Fund (Credit / Jama)</option>
              <option value="Expense">Expense (Debit / Kharcha)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="entryAmount" required min="1" placeholder="e.g. 500" />
          </div>
          <div class="form-group">
            <label>Description / Details</label>
            <input type="text" id="entryDesc" required placeholder="e.g. Sweeper payment, Electric bill" />
          </div>
          <div style="display: flex; gap: 8px; margin-top: 14px;">
            <button type="button" class="btn-outline" style="flex:1" onclick="closeLedgerModal()">Cancel</button>
            <button type="submit" id="saveEntryBtn" class="btn" style="flex:1">Save Entry</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    // ============================================================================
    // 1. CONFIGURATION (PASTE YOUR APPS SCRIPT URL HERE)
    // ============================================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

    let currentUser = null;
    let portalData = {
      users: [],
      gateTurns: [],
      maintenance: [],
      ledger: []
    };

    // DOM Elements
    const loginView = document.getElementById("loginView");
    const dashboardView = document.getElementById("dashboardView");
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const welcomeText = document.getElementById("welcomeText");
    const userSubText = document.getElementById("userSubText");
    const currentTurnBox = document.getElementById("currentTurnBox");
    const turnBadge = document.getElementById("turnBadge");
    const activeFamilyTitle = document.getElementById("activeFamilyTitle");
    const activeDateRange = document.getElementById("activeDateRange");
    const fcmStatusText = document.getElementById("fcmStatusText");
    const addEntryBtn = document.getElementById("addEntryBtn");

    // =================================================
