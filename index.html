<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society Management System</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 12px; background: #f0f2f5; color: #1c1e21; }
        .card { background: #fff; padding: 16px; margin-bottom: 14px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; font-size: 18px; color: #1a73e8; border-bottom: 2px solid #e8f0fe; padding-bottom: 8px; }
        h3 { margin-top: 12px; margin-bottom: 8px; font-size: 15px; color: #444; }
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 14px; }
        button { width: 100%; padding: 10px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
        button.small-btn { width: auto; padding: 5px 10px; font-size: 12px; margin: 2px; }
        button.green { background: #28a745; }
        button.orange { background: #e67e22; }
        button.red { background: #dc3545; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1a73e8; color: white; padding: 12px 16px; border-radius: 10px; margin-bottom: 14px; }
        .alert-banner { background: #fff3cd; border-left: 5px solid #ff9800; color: #856404; padding: 14px; border-radius: 8px; margin-bottom: 14px; font-weight: bold; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
        th, td { border: 1px solid #e1e4e8; padding: 8px; text-align: left; }
        th { background: #f8f9fa; color: #333; }
        .badge { padding: 3px 7px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; }
        .bg-active { background: #e67e22; }
        .bg-paid, .bg-completed { background: #28a745; }
        .bg-pending, .bg-upcoming { background: #6c757d; }
        #dashboard, .admin-only { display: none; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="card" style="margin-top: 40px;">
        <h2>Society Login</h2>
        <input type="text" id="username" placeholder="Enter Username">
        <input type="password" id="password" placeholder="Enter Password">
        <button onclick="login()">Login</button>
        <p id="login-msg" style="color: red; font-size: 13px; margin-top: 8px;"></p>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboard">
        <div class="top-bar">
            <div>
                <div id="welcome-name" style="font-weight: bold; font-size: 16px;"></div>
                <div id="user-role" style="font-size: 12px; opacity: 0.9;"></div>
            </div>
            <button class="small-btn red" onclick="logout()">Logout</button>
        </div>

        <!-- GATE TURN POPUP BANNER -->
        <div id="turn-alert" class="alert-banner">
            🚪 Aapka Gate Lock Karne Ka Turn Hai! <br>
            <span style="font-weight: normal; font-size: 13px;">Kripya roz raat 10:00 PM baje society gate lock karein. (9:55 PM daily phone alarm active hai).</span>
        </div>

        <!-- GATE DUTY SECTION -->
        <div class="card">
            <h2>Gate Lock Turn (10:00 PM)</h2>
            <div id="gate-table">Loading...</div>

            <div class="admin-only" style="margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px;">
                <h3>Admin: Add Gate Turn</h3>
                <input type="text" id="g-week" placeholder="Week (e.g. Week 4)">
                <input type="text" id="g-dates" placeholder="Dates (e.g. 16 Nov - 22 Nov)">
                <input type="text" id="g-family" placeholder="FamilyName (Exact match)">
                <select id="g-status">
                    <option value="Upcoming">Upcoming</option>
                    <option value="Active">Active</option>
                    <option value="Completed">Completed</option>
                </select>
                <button class="green" onclick="addGateTurn()">+ Add Gate Turn</button>
            </div>
        </div>

        <!-- MAINTENANCE SECTION -->
        <div class="card">
            <h2>Monthly Maintenance Collection</h2>
            <div id="maint-table">Loading...</div>

            <div class="admin-only" style="margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px;">
                <h3>Admin: Add Maintenance Record</h3>
                <input type="text" id="m-month" placeholder="Month (e.g. November 2026)">
                <input type="text" id="m-family" placeholder="FamilyName">
                <input type="number" id="m-amount" placeholder="Amount (e.g. 500)">
                <select id="m-status">
                    <option value="Pending">Pending</option>
                    <option value="Paid">Paid</option>
                </select>
                <button class="green" onclick="addMaintenance()">+ Add Maintenance Record</button>
            </div>
        </div>
    </div>

    <script>
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW:
        const API_URL ='https://script.google.com/macros/s/AKfycbxaOjgGNak_slpyi7hewHq9D0Ova3xmzdzk_qhaqDbLf5HrlG9E72kQ5q_4y7d5Mk0m/exec';

        let db = { users: [], gateTurns: [], maintenance: [] };
        let currentUser = null;

        async function loadDatabase() {
            try {
                document.getElementById("login-msg").innerText = "Connecting to database...";
                const res = await fetch(API_URL);
                db = await res.json();
                document.getElementById("login-msg").innerText = "";

                const savedUser = localStorage.getItem("societyUser");
                if (savedUser) {
                    currentUser = JSON.parse(savedUser);
                    showDashboard();
                }
            } catch (e) {
                document.getElementById("login-msg").innerText = "Error loading data. Check API URL.";
            }
        }

        function login() {
            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value.trim();
            const rows = db.users.slice(1); // Skip header row

            const found = rows.find(r => r[0] === u && r[1] === p);
            if (found) {
                currentUser = { username: found[0], familyName: found[2], role: found[3] };
                localStorage.setItem("societyUser", JSON.stringify(currentUser));
                showDashboard();
            } else {
                document.getElementById("login-msg").innerText = "Invalid username or password!";
            }
        }

        function logout() {
            localStorage.removeItem("societyUser");
            if (window.AndroidBridge) {
                window.AndroidBridge.setGateAlarm(false, "");
            }
            location.reload();
        }

        function showDashboard() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            document.getElementById("welcome-name").innerText = currentUser.familyName;
            document.getElementById("user-role").innerText = "Role: " + currentUser.role;

            if (currentUser.role.toLowerCase() === "admin") {
                document.querySelectorAll(".admin-only").forEach(el => el.style.display = "block");
            }

            renderGateTurns();
            renderMaintenance();
            checkGateTurnAlert();
        }

        function checkGateTurnAlert() {
            const rows = db.gateTurns.slice(1);
            const isMyTurn = rows.some(r => 
                r[2].trim().toLowerCase() === currentUser.familyName.trim().toLowerCase() && 
                r[3].trim().toLowerCase() === "active"
            );

            const banner = document.getElementById("turn-alert");
            if (isMyTurn) {
                banner.style.display = "block";
                // Trigger voice alert inside app
                if ('speechSynthesis' in window) {
                    let msg = new SpeechSynthesisUtterance("Attention! Is hafte raat das baje gate band karne ka aapka turn hai.");
                    msg.lang = "hi-IN";
                    window.speechSynthesis.speak(msg);
                }
                // Schedule Daily 9:55 PM Android Background Alarm
                if (window.AndroidBridge) {
                    window.AndroidBridge.setGateAlarm(true, currentUser.familyName);
                }
            } else {
                banner.style.display = "none";
                if (window.AndroidBridge) {
                    window.AndroidBridge.setGateAlarm(false, currentUser.familyName);
                }
            }
        }

        function renderGateTurns() {
            const isAdmin = currentUser.role.toLowerCase() === "admin";
            let html = "<table><tr><th>Week</th><th>Dates</th><th>Family</th><th>Status</th>";
            if (isAdmin) html += "<th>Action</th>";
            html += "</tr>";

            db.gateTurns.slice(1).forEach((r, idx) => {
                const rowIndex = idx + 1;
                const badgeClass = r[3] === "Active" ? "bg-active" : (r[3] === "Completed" ? "bg-completed" : "bg-upcoming");
                html += `<tr>
                    <td>${r[0]}</td>
                    <td>${r[1]}</td>
                    <td>${r[2]}</td>
                    <td><span class="badge ${badgeClass}">${r[3]}</span></td>`;
                if (isAdmin) {
                    const nextStatus = r[3] === "Upcoming" ? "Active" : (r[3] === "Active" ? "Completed" : "Upcoming");
                    html += `<td><button class="small-btn orange" onclick="updateGateStatus(${rowIndex}, '${r[0]}', '${r[1]}', '${r[2]}', '${nextStatus}')">Set ${nextStatus}</button></td>`;
                }
                html += "</tr>";
            });
            html += "</table>";
            document.getElementById("gate-table").innerHTML = html;
        }

        function renderMaintenance() {
            const isAdmin = currentUser.role.toLowerCase() === "admin";
            let html = "<table><tr><th>Month</th><th>Family</th><th>Amt</th><th>Status</th>";
            if (isAdmin) html += "<th>Action</th>";
            html += "</tr>";

            db.maintenance.slice(1).forEach((r, idx) => {
                const rowIndex = idx + 1;
                const badgeClass = r[3] === "Paid" ? "bg-paid" : "bg-pending";
                html += `<tr>
                    <td>${r[0]}</td>
                    <td>${r[1]}</td>
                    <td>₹${r[2]}</td>
                    <td><span class="badge ${badgeClass}">${r[3]}</span><br><small>${r[4] || ''}</small></td>`;
                if (isAdmin) {
                    const nextStatus = r[3] === "Paid" ? "Pending" : "Paid";
                    const today = nextStatus === "Paid" ? new Date().toLocaleDateString('en-GB') : "-";
                    html += `<td><button class="small-btn green" onclick="updateMaintStatus(${rowIndex}, '${r[0]}', '${r[1]}', '${r[2]}', '${nextStatus}', '${today}')">Mark ${nextStatus}</button></td>`;
                }
                html += "</tr>";
            });
            html += "</table>";
            document.getElementById("maint-table").innerHTML = html;
        }

        async function postToSheet(payload) {
            await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            });
            await loadDatabase();
            showDashboard();
        }

        function updateGateStatus(rowIndex, week, dates, family, newStatus) {
            postToSheet({ action: "updateRow", sheetName: "GateTurn", rowIndex: rowIndex, rowValues: [week, dates, family, newStatus] });
        }

        function updateMaintStatus(rowIndex, month, family, amount, newStatus, dateStr) {
            postToSheet({ action: "updateRow", sheetName: "Maintenance", rowIndex: rowIndex, rowValues: [month, family, amount, newStatus, dateStr] });
        }

        function addGateTurn() {
            const w = document.getElementById("g-week").value;
            const d = document.getElementById("g-dates").value;
            const f = document.getElementById("g-family").value;
            const s = document.getElementById("g-status").value;
            if (!w || !f) return alert("Please fill week and family name");
            postToSheet({ action: "addRow", sheetName: "GateTurn", rowValues: [w, d, f, s] });
        }

        function addMaintenance() {
            const m = document.getElementById("m-month").value;
            const f = document.getElementById("m-family").value;
            const a = document.getElementById("m-amount").value;
            const s = document.getElementById("m-status").value;
            const d = s === "Paid" ? new Date().toLocaleDateString('en-GB') : "-";
            if (!m || !f) return alert("Please fill month and family name");
            postToSheet({ action: "addRow", sheetName: "Maintenance", rowValues: [m, f, a, s, d] });
        }

        loadDatabase();
    </script>
</body>
</html>
