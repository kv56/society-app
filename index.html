<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Society Manager</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 14px;
      min-height: 100vh;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    h1 { font-size: 1.35rem; font-weight: 700; }
    h2 { font-size: 1.05rem; font-weight: 600; margin-bottom: 10px; }
    p.subtitle { font-size: 0.86rem; color: var(--muted); margin-top: 4px; margin-bottom: 16px; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 5px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: #fff;
    }
    input:focus, select:focus { border-color: var(--primary); }

    button.btn {
      width: 100%;
      padding: 11px;
      background-color: var(--primary);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button.btn:disabled { opacity: 0.6; cursor: not-allowed; }

    button.btn-outline {
      background: transparent;
      color: var(--danger);
      border: 1px solid #fecaca;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px 4px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Active Turn Banner */
    .turn-banner {
      padding: 14px;
      border-radius: 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      margin-bottom: 14px;
    }

    .turn-banner.my-turn {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .turn-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--primary);
      color: #fff;
      margin-bottom: 6px;
    }

    .my-turn .turn-badge { background: var(--success); }

    /* Filters Bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      max-height: 420px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th, td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      font-weight: 600;
      color: var(--muted);
      background: #f8fafc;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr.active-row td {
      background-color: #f0fdf4;
      font-weight: 600;
      color: #15803d;
    }

    /* Badges */
    .badge-paid {
      background: #dcfce7;
      color: #15803d;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.75rem;
      display: inline-block;
    }

    .badge-unpaid {
      background: #fee2e2;
      color: #b91c1c;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.75rem;
      display: inline-block;
    }

    .action-btn {
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }

    .action-btn.pay { background: var(--success); color: #fff; }
    .action-btn.unpay { background: #94a3b8; color: #fff; }

    /* Summary Bar */
    .summary-card {
      display: flex;
      justify-content: space-between;
      background: #f1f5f9;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }

    .summary-card b { color: var(--text); }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      color: var(--danger);
      margin-top: 8px;
    }

    .fcm-status {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      margin-top: 10px;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      padding: 18px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">

    <!-- ================= LOGIN VIEW ================= -->
    <div id="loginView" class="card">
      <h1>🏢 Society Manager</h1>
      <p class="subtitle">Login to check gate turn, maintenance & ledger</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password" />
        </div>

        <button type="submit" id="loginBtn" class="btn">Login</button>
        <div id="loginError" class="status-msg"></div>
      </form>
    </div>

    <!-- ================= DASHBOARD VIEW ================= -->
    <div id="dashboardView" class="hidden">
      <div class="top-bar">
        <div>
          <h1 id="welcomeText">Namaste!</h1>
          <div id="userSubText" style="font-size: 0.82rem; color: var(--muted);"></div>
        </div>
        <button id="logoutBtn" class="btn-outline">Logout</button>
      </div>

      <!-- Gate Turn Alert Banner -->
      <div id="currentTurnBox" class="turn-banner">
        <span id="turnBadge" class="turn-badge">Current Gate Turn</span>
        <h2 id="activeFamilyTitle" style="margin-bottom: 2px;">Checking...</h2>
        <div id="activeDateRange" style="font-size: 0.82rem; color: var(--muted);">Loading dates...</div>
      </div>

      <!-- Navigation Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('gateTab', this)">🚪 Gate Turn</button>
        <button class="tab-btn" onclick="switchTab('maintTab', this)">💳 Maintenance</button>
        <button class="tab-btn" onclick="switchTab('ledgerTab', this)">📊 Ledger</button>
      </div>

      <!-- TAB 1: Gate Turn Schedule -->
      <div id="gateTab" class="card">
        <h2>🗓️ Gate Locking Schedule</h2>
        <div class="table-wrap">
          <table id="gateTable"></table>
        </div>
      </div>

      <!-- TAB 2: Maintenance Records -->
      <div id="maintTab" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <h2>💳 Maintenance Records</h2>
        </div>

        <!-- Filter Dropdown -->
        <div class="filter-bar">
          <select id="maintMonthFilter" onchange="filterMaintenance()">
            <option value="ALL">All Months</option>
          </select>
          <select id="maintStatusFilter" onchange="filterMaintenance()">
            <option value="ALL">All Status</option>
            <option value="Paid">Paid</option>
            <option value="Unpaid">Unpaid / Pending</option>
          </select>
        </div>

        <div class="table-wrap">
          <table id="maintTable"></table>
        </div>
      </div>

      <!-- TAB 3: Society Ledger -->
      <div id="ledgerTab" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <h2>📊 Society Ledger</h2>
          <button id="addEntryBtn" class="action-btn pay hidden" onclick="openLedgerModal()">+ Add Entry</button>
        </div>

        <!-- Ledger Balance Summary -->
        <div class="summary-card">
          <div>Total Funds: <b id="sumCredit" style="color: var(--success);">₹0</b></div>
          <div>Expenses: <b id="sumDebit" style="color: var(--danger);">₹0</b></div>
          <div>Balance: <b id="sumBalance">₹0</b></div>
        </div>

        <!-- Filter Dropdown -->
        <div class="filter-bar">
          <select id="ledgerTypeFilter" onchange="filterLedger()">
            <option value="ALL">All Transactions</option>
            <option value="Fund">Funds / Credit Only</option>
            <option value="Expense">Expenses / Debit Only</option>
          </select>
        </div>

        <div class="table-wrap">
          <table id="ledgerTable"></table>
        </div>
      </div>

      <div id="fcmStatusText" class="fcm-status"></div>
    </div>

    <!-- ================= ADD LEDGER ENTRY MODAL ================= -->
    <div id="ledgerModal" class="modal hidden">
      <div class="modal-content">
        <h2>Add Ledger Transaction</h2>
        <form id="ledgerForm">
          <div class="form-group">
            <label>Type</label>
            <select id="entryType" required>
              <option value="Fund">Fund (Credit / Jama)</option>
              <option value="Expense">Expense (Debit / Kharcha)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="entryAmount" required min="1" placeholder="e.g. 500" />
          </div>
          <div class="form-group">
            <label>Description / Details</label>
            <input type="text" id="entryDesc" required placeholder="e.g. Sweeper payment, Electric bill" />
          </div>
          <div style="display: flex; gap: 8px; margin-top: 14px;">
            <button type="button" class="btn-outline" style="flex:1" onclick="closeLedgerModal()">Cancel</button>
            <button type="submit" id="saveEntryBtn" class="btn" style="flex:1">Save Entry</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script>
    // ============================================================================
    // 1. CONFIGURATION (PASTE YOUR APPS SCRIPT URL HERE)
    // ============================================================================
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxaOjgGNak_slpyi7hewHq9D0Ova3xmzdzk_qhaqDbLf5HrlG9E72kQ5q_4y7d5Mk0m/exec';

    let currentUser = null;
    let portalData = {
      users: [],
      gateTurns: [],
      maintenance: [],
      ledger: []
    };

    // DOM Elements
    const loginView = document.getElementById("loginView");
    const dashboardView = document.getElementById("dashboardView");
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const welcomeText = document.getElementById("welcomeText");
    const userSubText = document.getElementById("userSubText");
    const currentTurnBox = document.getElementById("currentTurnBox");
    const turnBadge = document.getElementById("turnBadge");
    const activeFamilyTitle = document.getElementById("activeFamilyTitle");
    const activeDateRange = document.getElementById("activeDateRange");
    const fcmStatusText = document.getElementById("fcmStatusText");
    const addEntryBtn = document.getElementById("addEntryBtn");

    // ============================================================================
    // 2. INIT & DATA LOAD
    // ============================================================================
    document.addEventListener("DOMContentLoaded", async () => {
      const savedUser = localStorage.getItem("society_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showDashboard();
        syncFcmTokenWithBackend(currentUser.username);
      } else {
        showLogin();
      }
      await fetchPortalData();
    });

    async function fetchPortalData() {
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        portalData = data;

        if (currentUser) {
          renderGateTurn();
          populateMaintenanceFilters();
          filterMaintenance();
          filterLedger();
        }
      } catch (err) {
        console.error("Failed to load portal data:", err);
      }
    }

    // ============================================================================
    // 3. FCM TOKEN SYNC (Checks AndroidBridge)
    // ============================================================================
    function syncFcmTokenWithBackend(username) {
      if (!username) return;

      if (window.AndroidBridge && typeof window.AndroidBridge.getFcmToken === "function") {
        let attempts = 0;
        const trySync = () => {
          attempts++;
          const token = window.AndroidBridge.getFcmToken();
          if (token && token.trim().length > 0) {
            fcmStatusText.textContent = "🔔 Registering device for 9:55 PM alerts...";

            fetch(APPS_SCRIPT_URL, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({
                action: "updateFcmToken",
                username: username,
                fcmToken: token.trim()
              })
            })
            .then(res => res.json())
            .then(data => {
              if (data.success) {
                fcmStatusText.textContent = "✅ Automatic 9:55 PM Hindi Voice Alerts Active";
              }
            })
            .catch(err => console.error("FCM Token sync error:", err));
          } else if (attempts < 4) {
            setTimeout(trySync, 2000);
          }
        };
        trySync();
      }
    }

    // ============================================================================
    // 4. LOGIN HANDLER
    // ============================================================================
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.textContent = "";
      loginBtn.textContent = "Checking...";
      loginBtn.disabled = true;

      const uInput = document.getElementById("username").value.trim().toLowerCase();
      const pInput = document.getElementById("password").value.trim();

      if (!portalData.users || portalData.users.length === 0) {
        await fetchPortalData();
      }

      const userRows = (portalData.users || []).slice(1);
      const headers = (portalData.users[0] || []).map(h => String(h).toLowerCase());

      const passIdx = headers.findIndex(h => h.includes("pass")) !== -1 ? headers.findIndex(h => h.includes("pass")) : 1;
      const familyIdx = headers.findIndex(h => h.includes("family") || (h.includes("name") && !h.includes("user"))) !== -1
        ? headers.findIndex(h => h.includes("family") || (h.includes("name") && !h.includes("user")))
        : (passIdx === 1 ? 2 : 1);
      const roleIdx = headers.findIndex(h => h.includes("role"));

      const matched = userRows.find(r => {
        const u = String(r[0] || "").trim().toLowerCase();
        const p = String(r[passIdx] || "").trim();
        return u === uInput && p === pInput;
      });

      loginBtn.textContent = "Login";
      loginBtn.disabled = false;

      if (matched) {
        const role = roleIdx !== -1 ? String(matched[roleIdx]).trim().toLowerCase() : (uInput === "admin" ? "admin" : "member");
        currentUser = {
          username: String(matched[0]).trim(),
          familyName: String(matched[familyIdx] || matched[0]).trim(),
          isAdmin: role === "admin" || uInput === "admin"
        };

        localStorage.setItem("society_user", JSON.stringify(currentUser));
        showDashboard();
        syncFcmTokenWithBackend(currentUser.username);
        renderGateTurn();
        populateMaintenanceFilters();
        filterMaintenance();
        filterLedger();
      } else {
        loginError.textContent = "Invalid username or password.";
      }
    });

    // ============================================================================
    // 5. DATE PARSER (Supports DD/MM/YYYY, YYYY-MM-DD, or Standard Strings)
    // ============================================================================
    function parseDateSafe(val) {
      if (!val) return null;
      if (val instanceof Date) return val;
      const str = String(val).trim();
      const parts = str.split(/[\/\-.]/);
      if (parts.length === 3) {
        if (parts[0].length <= 2 && parts[2].length === 4) {
          // DD/MM/YYYY
          return new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
        } else if (parts[0].length === 4) {
          // YYYY-MM-DD
          return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        }
      }
      const d = new Date(str);
      return isNaN(d.getTime()) ? null : d;
    }

    function formatDateShort(val) {
      const d = parseDateSafe(val);
      if (!d) return String(val);
      return d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
    }

    // ============================================================================
    // 6. RENDER GATE TURN TAB & ACTIVE HIGHLIGHT
    // ============================================================================
    function renderGateTurn() {
      const rows = portalData.gateTurns || [];
      const table = document.getElementById("gateTable");

      if (rows.length <= 1) {
        table.innerHTML = "<tr><td>No gate turns scheduled.</td></tr>";
        return;
      }

      const headers = rows[0];
      const dataRows = rows.slice(1);

      const today = new Date();
      today.setHours(0, 0, 0, 0);

      let activeFamily = null;
      let activeRange = "";

      let html = "<thead><tr>";
      headers.forEach(h => { html += `<th>${h}</th>`; });
      html += "</tr></thead><tbody>";

      dataRows.forEach(r => {
        const start = parseDateSafe(r[0]);
        const end = parseDateSafe(r[1]);
        const family = String(r[2] || "").trim();

        let isCurrent = false;
        if (start && end) {
          const s = new Date(start); s.setHours(0,0,0,0);
          const e = new Date(end); e.setHours(23,59,59,999);
          if (today >= s && today <= e) {
            isCurrent = true;
            activeFamily = family;
            activeRange = `${formatDateShort(r[0])} - ${formatDateShort(r[1])}`;
          }
        }

        html += `<tr class="${isCurrent ? 'active-row' : ''}">`;
        r.forEach((cell, idx) => {
          html += `<td>${idx === 0 || idx === 1 ? formatDateShort(cell) : cell}${isCurrent && idx === 2 ? ' 🔒 (Active)' : ''}</td>`;
        });
        html += "</tr>";
      });

      html += "</tbody>";
      table.innerHTML = html;

      // Update Banner
      if (activeFamily) {
        const isMyTurn = currentUser &&
          currentUser.familyName.toLowerCase() === activeFamily.toLowerCase();

        activeFamilyTitle.textContent = isMyTurn
          ? `🚪 Aapka Gate Turn Hai (${activeFamily})`
          : `${activeFamily} Family Turn`;
        activeDateRange.textContent = `${activeRange} • Kripya 10:00 PM baje gate lock karein`;

        if (isMyTurn) {
          currentTurnBox.classList.add("my-turn");
          turnBadge.textContent = "Your Active Turn";
          // Local fallback bridge trigger
          if (window.AndroidBridge && typeof window.AndroidBridge.setGateAlarm === "function") {
            window.AndroidBridge.setGateAlarm(true, activeFamily);
          }
        } else {
          currentTurnBox.classList.remove("my-turn");
          turnBadge.textContent = "Current Week Turn";
        }
      } else {
        activeFamilyTitle.textContent = "No Active Turn For Today";
        activeDateRange.textContent = "Please check the upcoming schedule below.";
      }
    }

    // ============================================================================
    // 7. RENDER MAINTENANCE TAB WITH FILTERS & ADMIN ACTION
    // ============================================================================
    function populateMaintenanceFilters() {
      const rows = (portalData.maintenance || []).slice(1);
      const monthSelect = document.getElementById("maintMonthFilter");
      const months = new Set();

      rows.forEach(r => {
        if (r[1]) months.add(String(r[1]).trim()); // Col B: Month/Period
      });

      monthSelect.innerHTML = `<option value="ALL">All Months</option>`;
      months.forEach(m => {
        monthSelect.innerHTML += `<option value="${m}">${m}</option>`;
      });
    }

    function filterMaintenance() {
      const rows = portalData.maintenance || [];
      const table = document.getElementById("maintTable");

      if (rows.length <= 1) {
        table.innerHTML = "<tr><td>No maintenance records found.</td></tr>";
        return;
      }

      const headers = rows[0];
      const dataRows = rows.slice(1);

      const monthFilter = document.getElementById("maintMonthFilter").value;
      const statusFilter = document.getElementById("maintStatusFilter").value;

      let html = "<thead><tr>";
      headers.forEach(h => { html += `<th>${h}</th>`; });
      if (currentUser && currentUser.isAdmin) {
        html += `<th>Admin Action</th>`;
      }
      html += "</tr></thead><tbody>";

      dataRows.forEach((r, idx) => {
        const rowMonth = String(r[1] || "").trim();
        // Detect Status column (often Col D or Col E)
        const statusIdx = r.findIndex(c => String(c).toLowerCase() === "paid" || String(c).toLowerCase() === "unpaid");
        const status = statusIdx !== -1 ? String(r[statusIdx]).trim() : String(r[3] || "").trim();

        const matchMonth = (monthFilter === "ALL" || rowMonth === monthFilter);
        const matchStatus = (statusFilter === "ALL" || (statusFilter === "Paid" ? status.toLowerCase() === "paid" : status.toLowerCase() !== "paid"));

        if (matchMonth && matchStatus) {
          const isPaid = status.toLowerCase() === "paid";
          html += "<tr>";
          r.forEach((cell, cIdx) => {
            if (cIdx === statusIdx || (statusIdx === -1 && cIdx === 3)) {
              html += `<td><span class="${isPaid ? 'badge-paid' : 'badge-unpaid'}">${cell}</span></td>`;
            } else {
              html += `<td>${cell}</td>`;
            }
          });

          // Admin button to toggle Paid / Unpaid
          if (currentUser && currentUser.isAdmin) {
            const rowIndexInSheet = idx + 2; // Row 1 is header
            html += `<td>
              <button class="action-btn ${isPaid ? 'unpay' : 'pay'}" onclick="toggleMaintStatus(${rowIndexInSheet}, '${isPaid ? 'Unpaid' : 'Paid'}')">
                Mark ${isPaid ? 'Unpaid' : 'Paid'}
              </button>
            </td>`;
          }
          html += "</tr>";
        }
      });

      html += "</tbody>";
      table.innerHTML = html;
    }

    async function toggleMaintStatus(sheetRow, newStatus) {
      if (!confirm(`Mark this record as ${newStatus}?`)) return;

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "updateMaintenance",
            row: sheetRow,
            status: newStatus
          })
        });
        const data = await res.json();
        if (data.success) {
          await fetchPortalData();
        } else {
          alert("Error: " + (data.message || "Failed to update"));
        }
      } catch (err) {
        alert("Server communication error");
      }
    }

    // ============================================================================
    // 8. RENDER LEDGER TAB WITH FILTERS, TOTALS & ADD ENTRY
    // ============================================================================
    function filterLedger() {
      const rows = portalData.ledger || [];
      const table = document.getElementById("ledgerTable");

      if (rows.length <= 1) {
        table.innerHTML = "<tr><td>No ledger transactions.</td></tr>";
        return;
      }

      const headers = rows[0];
      const dataRows = rows.slice(1);
      const typeFilter = document.getElementById("ledgerTypeFilter").value;

      let totalCredit = 0;
      let totalDebit = 0;

      let html = "<thead><tr>";
      headers.forEach(h => { html += `<th>${h}</th>`; });
      html += "</tr></thead><tbody>";

      dataRows.forEach(r => {
        // Look for Type and Amount columns
        const typeIdx = r.findIndex(c => String(c).toLowerCase().includes("fund") || String(c).toLowerCase().includes("expense") || String(c).toLowerCase().includes("credit") || String(c).toLowerCase().includes("debit"));
        const amountIdx = r.findIndex((c, idx) => idx > 0 && !isNaN(parseFloat(c)) && isFinite(c));

        const transType = typeIdx !== -1 ? String(r[typeIdx]).trim() : "";
        const amount = amountIdx !== -1 ? parseFloat(r[amountIdx]) || 0 : 0;

        const isCredit = transType.toLowerCase().includes("fund") || transType.toLowerCase().includes("credit") || transType.toLowerCase().includes("jama");

        if (isCredit) {
          totalCredit += amount;
        } else {
          totalDebit += amount;
        }

        const matchType = (typeFilter === "ALL" || (typeFilter === "Fund" ? isCredit : !isCredit));

        if (matchType) {
          html += "<tr>";
          r.forEach((cell, idx) => {
            if (idx === amountIdx) {
              html += `<td style="font-weight:600; color:${isCredit ? 'var(--success)' : 'var(--danger)'}">₹${cell}</td>`;
            } else {
              html += `<td>${cell}</td>`;
            }
          });
          html += "</tr>";
        }
      });

      html += "</tbody>";
      table.innerHTML = html;

      // Update Summary Totals
      document.getElementById("sumCredit").textContent = `₹${totalCredit}`;
      document.getElementById("sumDebit").textContent = `₹${totalDebit}`;
      const balance = totalCredit - totalDebit;
      const balEl = document.getElementById("sumBalance");
      balEl.textContent = `₹${balance}`;
      balEl.style.color = balance >= 0 ? "var(--success)" : "var(--danger)";
    }

    function openLedgerModal() {
      document.getElementById("ledgerModal").classList.remove("hidden");
    }

    function closeLedgerModal() {
      document.getElementById("ledgerModal").classList.add("hidden");
    }

    document.getElementById("ledgerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById("saveEntryBtn");
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      const entryType = document.getElementById("entryType").value;
      const entryAmount = document.getElementById("entryAmount").value;
      const entryDesc = document.getElementById("entryDesc").value;

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "addLedgerEntry",
            type: entryType,
            amount: entryAmount,
            description: entryDesc,
            addedBy: currentUser ? currentUser.username : "Admin"
          })
        });
        const data = await res.json();
        if (data.success) {
          closeLedgerModal();
          document.getElementById("ledgerForm").reset();
          await fetchPortalData();
        } else {
          alert("Error adding entry: " + (data.message || "Failed"));
        }
      } catch (err) {
        alert("Failed to connect to Google Sheets");
      }

      saveBtn.disabled = false;
      saveBtn.textContent = "Save Entry";
    });

    // ============================================================================
    // 9. TAB SWITCHER & VIEWS
    // ============================================================================
    function switchTab(tabId, btn) {
      ["gateTab", "maintTab", "ledgerTab"].forEach(id => {
        document.getElementById(id).classList.add("hidden");
      });
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));

      document.getElementById(tabId).classList.remove("hidden");
      btn.classList.add("active");
    }

    function showDashboard() {
      loginView.classList.add("hidden");
      dashboardView.classList.remove("hidden");
      if (currentUser) {
        welcomeText.textContent = `Namaste, ${currentUser.familyName}!`;
        userSubText.textContent = `Logged in as @${currentUser.username} ${currentUser.isAdmin ? '👑 (Admin)' : ''}`;
        if (currentUser.isAdmin) {
          addEntryBtn.classList.remove("hidden");
        } else {
          addEntryBtn.classList.add("hidden");
        }
      }
    }

    function showLogin() {
      dashboardView.classList.add("hidden");
      loginView.classList.remove("hidden");
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("society_user");
      currentUser = null;
      showLogin();
    });
  </script>
</body>
</html>
